<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NFC 첨부</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script type="module" src="./taskpane.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="./assets/icon.svg" width="48" height="48" alt="">
        <div>
          <h1>NFC 첨부</h1>
          <p>한글 파일명을 조합형 NFC로 붙입니다.</p>
        </div>
      </header>

      <section class="panel" aria-labelledby="attach-heading">
        <h2 id="attach-heading">파일 선택</h2>
        <label
          id="drop-zone"
          class="file-picker"
          for="file-input"
          aria-describedby="drop-help selection-summary"
        >
          <span class="drop-title">파일 고르기 또는 여기로 끌어놓기</span>
          <span id="drop-help" class="drop-help">
            여러 개를 한꺼번에 고를 수 있고, 나눠 골라도 아래 목록에 쌓입니다.
          </span>
          <input id="file-input" type="file" multiple>
        </label>
        <p id="selection-summary" class="muted">선택된 파일 없음</p>
        <ul id="file-list" class="file-list" aria-label="선택한 파일"></ul>
        <button id="attach-button" type="button" disabled>NFC로 첨부</button>
        <button id="clear-button" type="button" class="secondary" disabled>
          목록 비우기
        </button>
        <p class="limit">파일당 최대 25,000,000바이트 · 한도를 넘는 파일은 제외됩니다</p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">
        Outlook 연결을 확인하는 중…
      </p>

      <ul id="activity-list" class="activity" aria-label="첨부 결과"></ul>

      <details>
        <summary>개인정보와 동작 방식</summary>
        <p>
          파일은 이 패널에서 로컬로 읽은 뒤 Outlook의 공식 첨부 API로 전달됩니다.
          이 도구에는 파일을 받는 외부 서버, 분석 기능 또는 사용 기록 전송이 없습니다.
        </p>
      </details>
    </main>
  </body>
</html>
