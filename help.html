<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">

    <title>NFC 첨부 도움말</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <h1>NFC 첨부 도움말</h1>
      <section class="panel">
        <h2>사용법</h2>
        <ol>
          <li>최신 Outlook에서 새 메일을 작성합니다.</li>
          <li>리본의 NFC 첨부 버튼을 엽니다.</li>
          <li>파일 고르기에서 파일을 선택합니다.</li>
          <li>NFC로 첨부를 누릅니다.</li>
        </ol>
      </section>
      <p>
        일반 종이클립 버튼으로 추가한 파일은 이 도구가 변경하지 않습니다.
        문제가 생기면 추가 기능을 제거하고 로컬 런타임을 롤백할 수 있습니다.
      </p>
    </main>
